name: Morsel
options:
  bundleIdPrefix: com.jirathip
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: "2.55.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Morsel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Morsel
      - path: Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.morsel
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Morsel.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Morsel
        INFOPLIST_KEY_MorselSupabaseURL: ""
        INFOPLIST_KEY_MorselSupabaseAnonKey: ""
        INFOPLIST_KEY_MORSEL_MCP_URL: ""
        INFOPLIST_KEY_NSCameraUsageDescription: "Morsel uses the camera to attach a photo to your meal log."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Morsel uses your photo library to attach a photo to your meal log."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Morsel reads body mass from Apple Health to show your weight trend."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Morsel reads your weight and active energy from Apple Health and does not write health data."
        # Standard-encryption exemption: Morsel uses only Apple OS encryption
        # (HTTPS, Keychain, Sign in with Apple), so TestFlight compliance is
        # declared in the generated Info.plist instead of the ASC questionnaire.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  MorselTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MorselTests
    dependencies:
      - target: Morsel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jirathip.morsel.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Morsel:
    build:
      targets:
        Morsel: all
        MorselTests: [test]
    test:
      targets:
        - MorselTests
    run:
      config: Debug
    archive:
      config: Release
