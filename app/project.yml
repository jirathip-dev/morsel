name: Morsel
options:
  bundleIdPrefix: com.morsel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Morsel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Morsel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morsel.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Morsel
        INFOPLIST_KEY_MorselSupabaseURL: ""
        INFOPLIST_KEY_MorselSupabaseAnonKey: ""
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  MorselTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MorselTests
    dependencies:
      - target: Morsel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morsel.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Morsel:
    build:
      targets:
        Morsel: all
        MorselTests: [test]
    test:
      targets:
        - MorselTests
    run:
      config: Debug
    archive:
      config: Release
