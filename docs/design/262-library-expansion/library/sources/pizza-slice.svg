<title>Pizza slice — blistered crust, tomato wash and loose cheese</title>
<desc>Original ink and wash. A broad curved crust tapers to one pointed slice; broken pale cheese crosses the red sauce. Generic pizza, not a particular topping, portion or recipe.</desc>
