<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<title>Chicken wings — jointed cooked pieces, original ink-and-wash study</title>
<desc>Three warm-brown cooked wing pieces: a long two-ridged flat, a bent flat with its tapered wingtip and a small bone-ended drumette. A quiet celery baton sits beside them. Generic labeled coverage, not a claim of sauce, recipe, actual cut, ingredients or portion.</desc>
