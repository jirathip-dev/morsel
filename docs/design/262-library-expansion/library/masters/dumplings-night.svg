<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<title>Dumplings — four folded crescents with a small dip cup</title>
<desc>Original ink and wash. Two pale steamed crescents behind two pan-browned dumplings; oversized pleats carry the category at small size. No particular filling or recipe is claimed.</desc>
