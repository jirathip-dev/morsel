<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<title>Kimchi — chili-stained cabbage folds in a small ceramic bowl</title>
<desc>Original generic kimchi study. Ruffled red-orange leaf blades contrast with broad pale cabbage ribs. The label identifies kimchi; the art does not identify a recipe or all banchan.</desc>
