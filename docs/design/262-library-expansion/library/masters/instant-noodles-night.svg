<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<title>Instant noodles — crimped strands, soft egg and a warm bowl</title>
<desc>Original ink and wash. Tight wavy yellow noodle strands sit above broth in a low bowl with a soft egg, sparse scallion cuts and resting chopsticks. A generic labeled category study, not a brand, recipe or ingredient claim.</desc>
