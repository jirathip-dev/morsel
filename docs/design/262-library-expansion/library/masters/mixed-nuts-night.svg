<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<title>Mixed nuts — loose almond, cashew and walnut ink-wash study</title>
<desc>Original generic assortment with pointed almonds, open crescent cashews and a lobed walnut half. A labeled category illustration, not evidence of actual ingredients, allergens, portion or nutrition.</desc>
