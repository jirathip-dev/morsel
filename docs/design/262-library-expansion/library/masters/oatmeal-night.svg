<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<title>Oatmeal — coarse porridge in an open jar, original ink and wash</title>
<desc>Uneven cream oat folds and short swollen flakes distinguish the dense porridge from a liquid surface. A small berry cluster and leaning spoon accompany a squat layered jar. Generic labeled food art, not evidence of an actual recipe, ingredients, portion, allergy or nutrition.</desc>
