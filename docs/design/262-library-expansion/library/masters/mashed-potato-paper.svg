<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<title>Mashed potato — soft spooned ridges, butter pool and gravy wash</title>
<desc>A pale, uneven heap on a shallow plate, with a small golden hollow and gravy running down one side. The drawing does not identify an actual recipe, ingredients or serving.</desc>
<defs><filter id="wash" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
