<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<title>Coconut water — shaved young coconut, open crown and drinking straw</title>
<desc>Original generic ink-and-wash study. A broad cut opening and pale fibrous husk distinguish the coconut vessel; not a photograph or an ingredient or portion claim.</desc>
