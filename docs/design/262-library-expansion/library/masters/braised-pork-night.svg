<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<title>Braised pork — thick pieces and dark gravy, original ink and wash</title>
<desc>Three irregular meat pieces with pale connective seams, torn grain and pooled brown gravy on a broad plate. This is a generic braised-pork sign, not proof of a particular cut or recipe.</desc>
