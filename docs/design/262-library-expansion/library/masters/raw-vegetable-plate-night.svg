<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<title>Raw vegetable plate — cabbage wedge, cucumber batons and long beans</title>
<desc>Distinct uncooked cut forms fanned across a shallow plate, with pale cut faces, green skin and long curved pods. A generic assortment, not a claim about the contents of a logged meal.</desc>
