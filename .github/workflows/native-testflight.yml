name: Native TestFlight

on:
  workflow_dispatch:

concurrency:
  group: native-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decision.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - id: decision
        run: |
          if [ ! -f app/project.yml ]; then
            echo "app/project.yml is missing on $GITHUB_REF" >&2
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  native-beta:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum --algorithm 256 --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/xcodegen/xcodegen/bin:$PATH"
          xcodegen --version
      - name: Write ASC API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s' "$ASC_KEY_P8" | base64 --decode > fastlane/asc_api_key.p8
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: app
      - name: Xcode version
        run: xcodebuild -version
      - name: Build and upload native app to TestFlight
        run: LANG=en_US.UTF-8 bundle exec fastlane native_beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: fastlane/asc_api_key.p8
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Upload raw native archive log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-archive-raw-log-${{ github.run_attempt }}
          path: ~/Library/Logs/gym/**/*.log
          if-no-files-found: error
          retention-days: 7
