# Fly deploy CD (issue #137).
#
# SAFETY CONTRACT
# - workflow_dispatch ONLY: no push/pull_request trigger can deploy. Auto-deploy
#   on merge to main is deliberately OFF (Guy policy, mirrors Migration CD #83).
#   To opt in later, add: push: { branches: [main] } under `on:` — the gate job
#   already makes that safe (only green heads deploy).
# - The gate job allowlists the repo's CI checks and polls up to 10 minutes for
#   a fresh head's checks to settle; any hard failure refuses immediately, and
#   a timeout refuses fail-closed.
# - The deploy job FAILS CLOSED when FLY_API_TOKEN is absent (never a green skip).
# - Post-deploy guard re-pins the machine count to 1 (the #78 HA-machine trap),
#   then asserts health on BOTH canonical origins before declaring success.
name: Deploy Fly (morsel-mcp)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/SHA to deploy (default main)"
        required: false
        default: "main"
        type: string

concurrency:
  group: deploy-fly-morsel-mcp
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Assert dispatched head is green (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${{ github.repository }}/commits/${{ inputs.ref }}" --jq '.sha')"
          echo "gate: checking $SHA"
          [ -n "$SHA" ]
          # Allowlist the repo's CI checks EXPLICITLY. The workflow's own jobs
          # (gate/deploy) are excluded by design: at query time the gate's own
          # check-run is always "pending", which would self-refuse forever
          # (live-probe run 34001634282).
          # A just-merged head may not have check-runs YET — poll up to 10
          # minutes before refusing (live-probe run 34001962708); still fail
          # closed on timeout, hard failure, or a check that never appears.
          DEADLINE=$(( $(date +%s) + 600 ))
          while :; do
            PENDING=0
            for name in quality swiftlint bun-fly-entrypoint fastfile-contract; do
              C="$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
                --jq "[.check_runs[] | select(.name == \"$name\") | .conclusion] | last // \"absent\"")"
              echo "gate: $name -> $C"
              case "$C" in
                success|skipped|neutral) ;;
                absent|null|""|PENDING|pending|IN_PROGRESS|in_progress|QUEUED|queued)
                  PENDING=$((PENDING+1)) ;;
                *)
                  echo "::error::Check '$name' on $SHA is '$C'. Deploy REFUSED."
                  exit 1 ;;
              esac
            done
            [ "$PENDING" -eq 0 ] && break
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::CI checks not green within 10m on $SHA — deploy REFUSED (fail closed)."
              exit 1
            fi
            echo "gate: checks not settled ($PENDING pending) — polling again in 30s"
            sleep 30
          done
          echo "gate: PASS — head is green"

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Fail closed without FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Missing required secret FLY_API_TOKEN (repo secret). Fly deploy FAILED CLOSED."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@fc53d1e3219a4644f262cb3e2a1b0e6e0a9a5e7e

      - name: Deploy morsel-mcp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: fly deploy -a morsel-mcp --remote-only

      - name: Scale-count guard (exactly one machine)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          fly scale count 1 --yes -a morsel-mcp
          N="$(fly machines list -a morsel-mcp --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const ms=JSON.parse(s);console.log(ms.filter(m=>m.state==="started").length)})')"
          if [ "$N" != "1" ]; then
            echo "::error::Expected exactly 1 started machine after scale guard, got $N."
            exit 1
          fi

      - name: Health postconditions (both origins)
        run: |
          set -euo pipefail
          ok=0
          for base in https://mcp.morselfood.app https://morsel-mcp.fly.dev; do
            H="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/health")"
            C="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$base/mcp")"
            echo "postcondition: $base -> /health $H, POST /mcp $C"
            if [ "$H" = "200" ] && [ "$C" = "401" ]; then ok=$((ok+1)); else
              echo "::error::$base postcondition FAILED (want /health 200 + POST /mcp 401)."
            fi
          done
          [ "$ok" -eq 2 ] || exit 1
          echo "postconditions: PASS on both origins"
