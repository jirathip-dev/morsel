# Morsel production schema reconciliation (issue #76).
#
# SAFETY CONTRACT
# - workflow_dispatch ONLY: no push/pull_request/schedule event can run this
#   workflow, so a normal merge to main causes ZERO production SQL.
# - The production environment gate (required reviewers/approvals configured
#   on the repository) is the human approval layer.
# - Dispatch REQUIRES typing the exact issue #76 confirmation phrase; the
#   recovery CLI refuses to write without a byte-exact match.
# - Missing secrets FAIL CLOSED (nonzero exit) — never a green skip.
# - The job runs scripts/migration-recovery.mjs --apply, which inventories and
#   classifies 0001..0009 against their complete end-state contracts, converges
#   missing/partial end states with idempotent SQL inside per-step atomic
#   transactions, records the migration ledger only after each step's
#   in-transaction postcondition passes, and re-verifies everything before it
#   can report success.
name: Deploy Migrations (Recovery Apply)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Issue #76 production apply confirmation phrase (see docs/MIGRATION_RECOVERY.md)"
        required: true
        type: string

concurrency:
  group: deploy-migrations-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Reconcile and apply pending migrations (human-confirmed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing required secret SUPABASE_ACCESS_TOKEN (repo secret). Reconciliation apply FAILED CLOSED."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Missing required secret SUPABASE_PROJECT_REF (repo secret). Reconciliation apply FAILED CLOSED."
            exit 1
          fi
          if [ -z "$CONFIRMATION" ]; then
            echo "::error::Missing workflow_dispatch confirmation input. Reconciliation apply FAILED CLOSED."
            exit 1
          fi

          node scripts/migration-recovery.mjs --apply --confirm "$CONFIRMATION"
