# Quality gate — lint, typecheck, tests, build. ubuntu-latest ONLY (free
# pool; no Blacksmith/macOS until app/ has a real Xcode build to gate).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Supabase Edge Function
        run: deno check supabase/functions/mcp/index.ts

      - name: Bundle and probe Supabase Edge Function
        run: |
          log_file="$(mktemp)"
          response_file="$(mktemp)"
          npx --yes supabase@2.116.0 functions serve mcp --no-verify-jwt >"$log_file" 2>&1 &
          serve_pid=$!
          cleanup() {
            kill "$serve_pid" 2>/dev/null || true
            wait "$serve_pid" 2>/dev/null || true
            rm -f "$log_file" "$response_file"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 180); do
            if ! kill -0 "$serve_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            if curl --fail --silent --show-error \
              http://127.0.0.1:54321/functions/v1/mcp/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 180 ]; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error \
            http://127.0.0.1:54321/functions/v1/mcp/health
          printf '\n'
          mcp_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            http://127.0.0.1:54321/functions/v1/mcp/mcp)"
          printf 'Hosted MCP status: %s\n' "$mcp_status"
          cat "$response_file"
          printf '\n'
          test "$mcp_status" = 401

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL migration-test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        # npm test includes db/postgres-integration.test.ts; it starts its own
        # ephemeral cluster and never needs Supabase credentials.
        run: npm test

      - name: Build
        run: npm run build

  swiftlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint (skips cleanly while app/ has no Swift sources)
        run: |
          if ! find app -name '*.swift' -print -quit | grep -q .; then
            echo "No Swift sources under app/ yet — skipping SwiftLint."
            exit 0
          fi
          docker run --rm -v "$PWD":/work -w /work \
            ghcr.io/realm/swiftlint:latest swiftlint lint --strict
