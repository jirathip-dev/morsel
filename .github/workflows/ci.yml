# Quality gate — lint, typecheck, tests, build. ubuntu-latest ONLY (free
# pool; no Blacksmith/macOS until app/ has a real Xcode build to gate).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Supabase Edge Function
        run: deno check supabase/functions/mcp/index.ts

      - name: Bundle and probe Supabase Edge Function
        run: |
          start_log="$(mktemp)"
          serve_log="$(mktemp)"
          health_file="$(mktemp)"
          response_file="$(mktemp)"
          oauth_metadata_file="$(mktemp)"
          protected_metadata_file="$(mktemp)"
          registration_file="$(mktemp)"
          oauth_env_file="$(mktemp)"
          oauth_headers_file="$(mktemp)"
          protected_headers_file="$(mktemp)"
          authorize_headers_file="$(mktemp)"
          authorize_stage_headers_file="$(mktemp)"
          authorize_stage_body_file="$(mktemp)"
          mcp_headers_file="$(mktemp)"
          alias_headers_file="$(mktemp)"
          preflight_headers_file="$(mktemp)"
          function_config="supabase/functions/mcp/deno.json"
          function_config_created=0
          cleanup() {
            if [ -n "${serve_pid:-}" ]; then
              kill "$serve_pid" 2>/dev/null || true
              wait "$serve_pid" 2>/dev/null || true
            fi
            /usr/bin/timeout 60s npx --yes supabase@2.116.0 stop --project-id morsel --no-backup >/dev/null 2>&1 || true
            if [ "$function_config_created" -eq 1 ]; then
              rm -f "$function_config"
            fi
            rm -f "$start_log" "$serve_log" "$health_file" "$response_file" \
              "$oauth_metadata_file" "$protected_metadata_file" "$registration_file" "$oauth_env_file" \
              "$oauth_headers_file" "$protected_headers_file" "$authorize_headers_file" \
              "$authorize_stage_headers_file" "$authorize_stage_body_file" \
              "$mcp_headers_file" "$alias_headers_file" "$preflight_headers_file"
          }
          trap cleanup EXIT

          if [ -e "$function_config" ]; then
            printf 'Unexpected committed function config: %s\n' "$function_config"
            exit 1
          fi
          cp deno.json "$function_config"
          function_config_created=1
          printf 'MORSEL_OAUTH_SIGNING_KEY=ci-bundle-test-key\n' >"$oauth_env_file"
          printf 'MORSEL_OAUTH_AUTHORIZATION_ENDPOINT=https://morsel-authorize-ui.vercel.app/authorize\n' >>"$oauth_env_file"

          if ! /usr/bin/timeout 240s npx --yes supabase@2.116.0 start \
            --exclude gotrue,realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,logflare,vector,supavisor \
            --ignore-health-check >"$start_log" 2>&1; then
            cat "$start_log"
            exit 1
          fi

          npx --yes supabase@2.116.0 functions serve mcp --no-verify-jwt \
            --env-file "$oauth_env_file" \
            >"$serve_log" 2>&1 &
          serve_pid=$!

          fail_bundle_probe() {
            printf '%s\n' 'Supabase start log:'
            cat "$start_log"
            printf '%s\n' 'Functions serve log:'
            cat "$serve_log"
            exit 1
          }

          for attempt in $(seq 1 180); do
            if ! kill -0 "$serve_pid" 2>/dev/null; then
              fail_bundle_probe
            fi
            if health_status="$(curl --silent --show-error --output "$health_file" --write-out '%{http_code}' \
              http://127.0.0.1:54321/functions/v1/mcp/health)"; then
              if [ "$health_status" = 200 ]; then
                break
              fi
            fi
            if [ "$attempt" -eq 180 ]; then
              fail_bundle_probe
            fi
            sleep 1
          done

          if ! health_status="$(curl --silent --show-error --output "$health_file" --write-out '%{http_code}' \
            http://127.0.0.1:54321/functions/v1/mcp/health)"; then
            fail_bundle_probe
          fi
          printf 'Hosted health status: %s\n' "$health_status"
          cat "$health_file"
          printf '\n'
          if [ "$health_status" != 200 ]; then
            fail_bundle_probe
          fi

          if ! oauth_status="$(curl --silent --show-error --output "$oauth_metadata_file" --write-out '%{http_code}' \
            http://127.0.0.1:54321/functions/v1/mcp/.well-known/oauth-authorization-server)"; then
            fail_bundle_probe
          fi
          printf 'Hosted OAuth metadata status: %s\n' "$oauth_status"
          cat "$oauth_metadata_file"
          printf '\n'
          if [ "$oauth_status" != 200 ]; then
            fail_bundle_probe
          fi

          python3 - "$oauth_metadata_file" <<'PY'
          import json
          import sys
          from urllib.parse import urlparse

          with open(sys.argv[1]) as handle:
              metadata = json.load(handle)

          # Issue #69: the browser consent skin is the Vercel static page
          # again — Supabase's free shared domain rewrites function text/html
          # to text/plain, so the function origin cannot render consent HTML.
          # This CI run sets the synthetic endpoint above to exercise the
          # configured mode: authorization_endpoint must be that external page
          # while issuer/token/register stay on the Supabase base.
          expected_authorization_endpoint = 'https://morsel-authorize-ui.vercel.app/authorize'
          supabase_base = metadata.get('issuer')
          if not isinstance(supabase_base, str) or not urlparse(supabase_base).netloc:
              raise SystemExit('OAuth metadata issuer must be an absolute Supabase base URL')
          if metadata.get('authorization_endpoint') != expected_authorization_endpoint:
              raise SystemExit('OAuth metadata authorization_endpoint must be the external static authorization page')
          if urlparse(supabase_base).netloc == urlparse(expected_authorization_endpoint).netloc:
              raise SystemExit('OAuth issuer must remain on the Supabase host')
          for field, suffix in {
              'token_endpoint': '/token',
              'registration_endpoint': '/register',
          }.items():
              if metadata.get(field) != supabase_base.rstrip('/') + suffix:
                  raise SystemExit('OAuth metadata field %s must remain on the Supabase issuer base' % field)
          print('OAuth metadata split: external authorization endpoint; Supabase issuer/token/register')
          PY

          # Browser-facing OAuth/MCP response contracts (issue #55): the Edge
          # runtime must expose CORS on discovery and make the 401
          # WWW-Authenticate challenge browser-readable. Asserted against
          # `functions serve` (the LOCAL Edge runtime — NOT the hosted
          # supabase.co gateway, which rewrites GET text/html to text/plain
          # without a custom domain). Consent HTML itself is never served by
          # the function in production: the browser skin is the Vercel page
          # (issue #69), so the /authorize GET below only pins the
          # direct-visit fallback, and the stage-1 POST must be a bodyless
          # 302 back to the external page.
          assert_response_header() {
            headers_file="$1"
            expected_header="$2"
            expected_value="$3"
            if ! tr -d '\r' <"$headers_file" | grep -qi "^${expected_header}: ${expected_value}$"; then
              printf 'Missing response header %s: %s\n' "$expected_header" "$expected_value"
              cat "$headers_file"
              fail_bundle_probe
            fi
          }

          curl --silent --show-error --dump-header "$oauth_headers_file" --output /dev/null \
            http://127.0.0.1:54321/functions/v1/mcp/.well-known/oauth-authorization-server
          assert_response_header "$oauth_headers_file" 'access-control-allow-origin' '\*'
          assert_response_header "$oauth_headers_file" 'access-control-expose-headers' 'WWW-Authenticate'

          curl --silent --show-error --dump-header "$protected_headers_file" --output /dev/null \
            http://127.0.0.1:54321/functions/v1/mcp/.well-known/oauth-protected-resource/mcp
          assert_response_header "$protected_headers_file" 'access-control-allow-origin' '\*'

          # Issue #57: the canonical MCP transport is the function ROOT
          # (public https://<host>/functions/v1/mcp). The unauthenticated GET
          # on it must return the browser-readable 401 challenge, and the
          # pre-#57 nested /mcp/mcp path must keep serving the same challenge
          # as a compatibility alias without advertising its own metadata.
          mcp_challenge_status="$(curl --silent --show-error --dump-header "$mcp_headers_file" --output /dev/null \
            --write-out '%{http_code}' \
            http://127.0.0.1:54321/functions/v1/mcp)"
          if [ "$mcp_challenge_status" != 401 ]; then
            printf 'Expected unauthenticated canonical MCP challenge status 401, got: %s\n' "$mcp_challenge_status"
            fail_bundle_probe
          fi
          assert_response_header "$mcp_headers_file" 'access-control-allow-origin' '\*'
          assert_response_header "$mcp_headers_file" 'access-control-expose-headers' 'WWW-Authenticate'

          mcp_alias_status="$(curl --silent --show-error --dump-header "$alias_headers_file" --output /dev/null \
            --write-out '%{http_code}' \
            http://127.0.0.1:54321/functions/v1/mcp/mcp)"
          if [ "$mcp_alias_status" != 401 ]; then
            printf 'Expected compatibility-alias MCP challenge status 401, got: %s\n' "$mcp_alias_status"
            fail_bundle_probe
          fi
          assert_response_header "$alias_headers_file" 'access-control-allow-origin' '\*'
          assert_response_header "$alias_headers_file" 'access-control-expose-headers' 'WWW-Authenticate'

          curl --silent --show-error --dump-header "$preflight_headers_file" --output /dev/null \
            --request OPTIONS \
            http://127.0.0.1:54321/functions/v1/mcp
          assert_response_header "$preflight_headers_file" 'access-control-allow-origin' '\*'

          if ! protected_status="$(curl --silent --show-error --output "$protected_metadata_file" --write-out '%{http_code}' \
            http://127.0.0.1:54321/functions/v1/mcp/.well-known/oauth-protected-resource/mcp)"; then
            fail_bundle_probe
          fi
          printf 'Hosted protected-resource metadata status: %s\n' "$protected_status"
          cat "$protected_metadata_file"
          printf '\n'
          if [ "$protected_status" != 200 ]; then
            fail_bundle_probe
          fi
          python3 - "$protected_metadata_file" "$oauth_metadata_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as handle:
              protected = json.load(handle)
          with open(sys.argv[2]) as handle:
              authorization_server = json.load(handle)
          supabase_base = authorization_server.get('issuer')
          if protected.get('resource') != supabase_base or protected.get('authorization_servers') != [supabase_base]:
              raise SystemExit('protected-resource metadata must remain on the Supabase issuer base')
          PY

          if ! registration_status="$(curl --silent --show-error --output "$registration_file" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"redirect_uris":["https://ci.example/callback"]}' \
            http://127.0.0.1:54321/functions/v1/mcp/register)"; then
            fail_bundle_probe
          fi
          printf 'Hosted OAuth registration status: %s\n' "$registration_status"
          cat "$registration_file"
          printf '\n'
          if [ "$registration_status" != 201 ]; then
            fail_bundle_probe
          fi

          # The authorize-form probe must run only after the registration POST
          # above has succeeded and populated $registration_file (issue #55
          # hosted-CI r1: consuming it earlier failed the probe with an empty
          # client_id). With the external page configured (issue #69) a GET is
          # the direct-visit fallback only: the function still renders the
          # server-side email stage at the Edge runtime layer. Hosted
          # text/html rewrites never affect the consent flow because the
          # Vercel skin is the browser surface.
          authorize_client_id="$(sed -n 's/.*"client_id":"\([^"]*\)".*/\1/p' "$registration_file")"
          if [ -z "$authorize_client_id" ]; then
            printf 'Could not extract client_id from registration response\n'
            fail_bundle_probe
          fi
          curl --silent --show-error --dump-header "$authorize_headers_file" --output /dev/null \
            --get \
            --data-urlencode "client_id=$authorize_client_id" \
            --data-urlencode 'code_challenge=ci-challenge' \
            --data-urlencode 'code_challenge_method=S256' \
            --data-urlencode 'redirect_uri=https://ci.example/callback' \
            --data-urlencode 'response_type=code' \
            http://127.0.0.1:54321/functions/v1/mcp/authorize
          assert_response_header "$authorize_headers_file" 'content-type' 'text/html; charset=utf-8'

          # Configured-mode stage contract (issue #69): the email form POST
          # from the Vercel skin must be a bodyless 302 back to the external
          # page carrying every OAuth parameter plus a fresh sealed
          # transaction envelope and the #code-entry fragment — never HTML
          # from the function origin.
          authorize_stage_status="$(curl --silent --show-error --dump-header "$authorize_stage_headers_file" --output "$authorize_stage_body_file" \
            --write-out '%{http_code}' \
            --request POST \
            --data-urlencode 'email=ci-probe@example.com' \
            "http://127.0.0.1:54321/functions/v1/mcp/authorize?client_id=$authorize_client_id&code_challenge=ci-challenge&code_challenge_method=S256&redirect_uri=https%3A%2F%2Fci.example%2Fcallback&response_type=code&state=ci-state-123")"
          printf 'Hosted authorize stage-1 POST status: %s\n' "$authorize_stage_status"
          if [ "$authorize_stage_status" != 302 ]; then
            printf 'Expected configured-mode stage-1 POST to redirect (302), got: %s\n' "$authorize_stage_status"
            fail_bundle_probe
          fi
          if [ -s "$authorize_stage_body_file" ]; then
            printf 'Configured-mode stage-1 response must have an empty body\n'
            cat "$authorize_stage_body_file"
            fail_bundle_probe
          fi
          if ! tr -d '\r' <"$authorize_stage_headers_file" | grep -qi '^location: https://morsel-authorize-ui\.vercel\.app/authorize?'; then
            printf 'Configured-mode stage-1 Location must be the external authorization page\n'
            cat "$authorize_stage_headers_file"
            fail_bundle_probe
          fi
          if ! tr -d '\r' <"$authorize_stage_headers_file" | grep -qi '^location: .*transaction='; then
            printf 'Configured-mode stage-1 Location must carry the sealed transaction envelope\n'
            cat "$authorize_stage_headers_file"
            fail_bundle_probe
          fi
          if ! tr -d '\r' <"$authorize_stage_headers_file" | grep -qi '^location: .*#code-entry$'; then
            printf 'Configured-mode stage-1 Location must end with the #code-entry fragment\n'
            cat "$authorize_stage_headers_file"
            fail_bundle_probe
          fi

          # Issue #57: the final MCP initialize probe goes to the CANONICAL
          # function-root transport (…/functions/v1/mcp) and expects the 401
          # application/json challenge.
          if ! mcp_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            http://127.0.0.1:54321/functions/v1/mcp)"; then
            fail_bundle_probe
          fi
          printf 'Hosted MCP status: %s\n' "$mcp_status"
          cat "$response_file"
          printf '\n'
          if [ "$mcp_status" != 401 ]; then
            fail_bundle_probe
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL migration-test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        # npm test includes db/postgres-integration.test.ts; it starts its own
        # ephemeral cluster and never needs Supabase credentials.
        run: npm test

      - name: Build
        run: npm run build

  swiftlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint (skips cleanly while app/ has no Swift sources)
        run: |
          if ! find app -name '*.swift' -print -quit | grep -q .; then
            echo "No Swift sources under app/ yet — skipping SwiftLint."
            exit 0
          fi
          docker run --rm -v "$PWD":/work -w /work \
            ghcr.io/realm/swiftlint:latest swiftlint lint --strict

  fastfile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.5"

      - name: Run executable Fastfile contract tests
        run: |
          ruby fastlane/supabase_xcargs.test.rb
          # built-plist.test.rb skips cleanly on Linux (needs xcodebuild);
          # on a macOS runner it is a hard built-artifact gate.
          ruby fastlane/built-plist.test.rb
