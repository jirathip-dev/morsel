# Read-only migration ledger reconciliation (issue #12). Runs ONLY on an
# explicit human workflow_dispatch: no push or other event can invoke a live
# query without a human-triggered dispatch. It never --adopts, executes
# migration SQL, inserts ledger rows, bootstraps the ledger, or modifies the
# live project — it inventories the hosted schema and reports sentinel
# presence/absence so a human can decide whether manual adoption is safe.
name: Reconcile Migrations (Read-Only)

on:
  workflow_dispatch:

concurrency:
  group: reconcile-migrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Reconcile hosted schema (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing required secret SUPABASE_ACCESS_TOKEN (repo secret). Add it to run read-only reconciliation."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Missing required secret SUPABASE_PROJECT_REF (repo secret). Add it to run read-only reconciliation."
            exit 1
          fi

          node scripts/migration-reconcile.mjs
