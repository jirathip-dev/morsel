# Deploy the MCP Edge Function to the hosted Supabase project (issue #12).
# Fails closed BEFORE deployment if any required secret is unset. It never
# creates or synthesizes MORSEL_OAUTH_SIGNING_KEY — that missing key is a
# human gate, not something this workflow may invent.
name: Deploy Edge Function

on:
  push:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "server/**"
      - "packages/schema/**"
      - "deno.json"
      - ".github/workflows/deploy-edge-function.yml"
  workflow_dispatch:

concurrency:
  group: deploy-edge-function-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Deploy MCP Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MORSEL_OAUTH_SIGNING_KEY: ${{ secrets.MORSEL_OAUTH_SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing required secret SUPABASE_ACCESS_TOKEN (repo secret). Add it to deploy the MCP Edge Function."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Missing required secret SUPABASE_PROJECT_REF (repo secret). Add it to deploy the MCP Edge Function."
            exit 1
          fi
          if [ -z "$MORSEL_OAUTH_SIGNING_KEY" ]; then
            echo "::error::Missing required secret MORSEL_OAUTH_SIGNING_KEY (repo secret). Human gate: the OAuth signing key is not wired; add it to enable deployment. This workflow never creates or synthesizes the key."
            exit 1
          fi

          # Push runs on non-main branches validate the same config/env checks
          # but must never deploy (workflow_dispatch always deploys).
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Skipping deploy: push to ${GITHUB_REF}; deployment is main-only."
            exit 0
          fi

          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          chmod 600 "$secrets_file"
          printf 'MORSEL_OAUTH_SIGNING_KEY=%s\n' "$MORSEL_OAUTH_SIGNING_KEY" > "$secrets_file"

          npx --yes supabase@2.116.0 secrets set --env-file "$secrets_file" --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@2.116.0 functions deploy mcp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --import-map deno.json

      - name: Probe deployed MCP endpoint
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/mcp"

          echo "== health =="
          curl --fail --silent --show-error --max-time 30 "$base/health"
          echo

          echo "== OAuth authorization-server metadata =="
          oauth_file="$(mktemp)"
          curl --fail --silent --show-error --max-time 30 --output "$oauth_file" \
            "$base/.well-known/oauth-authorization-server"
          cat "$oauth_file"
          echo
          rm -f "$oauth_file"

          echo "== unauthenticated MCP initialize (expect 401) =="
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            "$base/mcp")"
          echo "status: $status"
          cat "$response_file"
          echo
          rm -f "$response_file"
          if [ "$status" != "401" ]; then
            echo "::error::Expected HTTP 401 for unauthenticated MCP initialize; got $status"
            exit 1
          fi
