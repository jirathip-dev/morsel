# Morsel issue #261 — deployed Fly revision watchdog.
#
# Scheduled daily (and dispatchable on demand) READ-ONLY check that compares
# main's HEAD with the revision ACTUALLY RUNNING on the Fly origin, read from
# that origin's own `/version` route (the revision baked into the running image
# at build time — see docs/FLY_DEPLOY.md §"Deployed revision"). It exists
# because the Fly deploy is human-dispatched: on 2026-09-15 production was 3
# days / 2 releases behind main and nothing reported it (/health answered 200
# the whole time).
#
# Stays SILENT on a clean state (IN_SYNC, exit 0, no issue). When main is ahead
# it opens an issue titled "Morsel Fly revision drift: deployed morsel-mcp is
# behind main" (or refreshes the existing open one with a comment, so a
# recurring lag does not spam duplicate issues) and the comment body carries
# the commits main is ahead by.
#
# SAFETY CONTRACT
# - READ-ONLY: the workflow runs `node scripts/fly-revision-watchdog.mjs`,
#   which performs GET requests only (the origin's /version and the GitHub read
#   API). It never deploys, never installs flyctl, and never mutates Fly or
#   production in any way; no deploy input, token, or secret appears in the
#   report.
# - FAIL CLOSED: it never degrades to a green "in sync" skip. A missing token
#   fails the job, and an unobservable deployment (unreachable origin, missing
#   or malformed revision bake) exits nonzero with the UNKNOWN reason — the
#   watchdog is the authority, this workflow only files the issue.
name: Fly Revision Watchdog

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: fly-revision-watchdog
  cancel-in-progress: false

jobs:
  revision-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Compare main with the DEPLOYED revision (read-only)
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::Missing GitHub token for the read-only compare. Fly revision watchdog FAILED CLOSED."
            exit 1
          fi

          status=0
          out="$(node scripts/fly-revision-watchdog.mjs)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error::Fly revision watchdog could not observe the deployed revision (exit $status) — FAILED CLOSED (never a green in-sync skip)."
            exit "$status"
          fi

          if printf '%s\n' "$out" | grep -q '^BEHIND=true'; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$out" | sed '0,/^BEHIND=true/d' > .revision-report.txt
          else
            echo "behind=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the revision drift issue
        if: steps.detect.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Morsel Fly revision drift: deployed morsel-mcp is behind main"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file .revision-report.txt
            echo "Refreshed existing revision drift issue #$number with the latest deployed-revision report."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file .revision-report.txt
          fi
